<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NearHelp mein login karein." />
    <title>Login — NearHelp</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <script type="module" src="/js/auth.js"></script>
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="NearHelp home">
        <img src="/assets/logo.svg" alt="" width="36" height="36" />
        <span>NearHelp</span>
      </a>

      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/signup.html">Sign up</a>
      </nav>
    </header>

    <main class="container auth-container">
      <section class="auth-card" aria-labelledby="login-heading">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-heading">Login</h1>
        <p>Sign in to your NearHelp account.</p>

        <form id="login-form">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />

          <label for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="72"
              required
            />
            <button
              id="toggle-password"
              class="password-toggle"
              type="button"
              aria-controls="password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>

          <a
            class="forgot-password"
            href="mailto:kabeerhusain765@gmail.com?subject=NearHelp%20password%20help"
          >
            Forgot your password?
          </a>

          <button class="button button-primary button-block" type="submit">Login</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>

        <p>
          New to NearHelp?
          <a href="/signup.html">Create an account</a>
        </p>
      </section>
    </main>
    <script type="module" src="/js/ads.js"></script>
  </body>
</html>
